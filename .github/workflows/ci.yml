name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Moderate advisories currently outnumber what we can remediate offline;
      # keep them visible without failing every PR (#786 follow-up).
      - name: Run npm audit (moderate, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # #463: build and serve with non-production credentials so the Supabase/TMDB
  # code paths are exercised instead of only the mock/demo branch.
  # #784: Previously this job silently passed in demo mode when secrets were
  # absent, masking untested real paths. Guard explicitly: if the secrets are
  # missing the job FAILS rather than reporting green. Forks/PRs without
  # access to secrets should not expect this job to pass; configure the
  # secrets or rely on lint-build for demo-mode coverage.
  smoke:
    name: Build Smoke (Supabase path, secrets required)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase/TMDB secrets present
        # #784: Make the secrets-gating explicit instead of silently falling
        # back to demo mode. Fail fast with a clear message when any secret is
        # missing so the job cannot report green without exercising real paths.
        run: |
          missing=""
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "${{ secrets.TMDB_API_KEY }}" ] && missing="$missing TMDB_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Smoke job requires these secrets but they are missing:$missing"
            echo "Configure them in repository settings or rely on lint-build for demo-mode coverage."
            exit 1
          fi

      - name: Build with Supabase env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run build

      - name: Serve and smoke test routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PORT: '3100'
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3100/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3100/api/health
          curl -fsS -o /dev/null -w '/ %{http_code}\n' http://localhost:3100/
          curl -fsS -o /dev/null -w '/search %{http_code}\n' http://localhost:3100/search
          curl -fsS -o /dev/null -w '/sitemap.xml %{http_code}\n' http://localhost:3100/sitemap.xml
